services:

  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - app-network

  api:
    build: ./api
    container_name: api
    ports:
      - ${API_PORT}:${API_PORT}
    command: sh -c "./wait-for-it.sh mysql:3306 -t 60 -- npm run start:prod"
    env_file:
      - ./api/.env
    depends_on:
      - mysql
    networks:
      - app-network

  web-client:
    build:
      context: ./web-client
    container_name: web-client
    ports:
      - ${WEB_CLIENT_PORT}:80
    env_file:
      - ./web-client/.env
    depends_on:
      - api
    networks:
      - app-network

  timetabling-service:
    build: ./timetabling-service
    container_name: timetabling-service
    env_file:
      - ./timetabling-service/.env
    depends_on:
      - rabbitmq
      - api
    networks:
      - app-network
    restart: always

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    env_file:
      - ./.env
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

volumes:
  rabbitmq_data:
  mysql_data:

networks:
  app-network:
    driver: bridge
